name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal macOS app
        shell: bash
        run: |
          set -euo pipefail
          SRC=(
            KeepAwakeMac/KeepAwakeMacApp.swift
            KeepAwakeMac/AwakeManager.swift
            KeepAwakeMac/SystemPowerVeto.swift
            KeepAwakeMac/AwakeMenuView.swift
            KeepAwakeMac/SessionDuration.swift
          )
          HELPER_SRC=KeepAwakeMac/LidWatchdog.swift

          mkdir -p build/arm64 build/x86_64 "build/KeepAwakeMac.app/Contents/MacOS"

          xcrun swiftc "${SRC[@]}" \
            -parse-as-library \
            -O \
            -target arm64-apple-macos13.0 \
            -framework SwiftUI -framework AppKit -framework CoreGraphics -framework IOKit \
            -o build/arm64/KeepAwakeMac

          xcrun swiftc "${SRC[@]}" \
            -parse-as-library \
            -O \
            -target x86_64-apple-macos13.0 \
            -framework SwiftUI -framework AppKit -framework CoreGraphics -framework IOKit \
            -o build/x86_64/KeepAwakeMac

          xcrun swiftc "$HELPER_SRC" \
            -parse-as-library \
            -O \
            -target arm64-apple-macos13.0 \
            -framework CoreGraphics -framework IOKit \
            -o build/arm64/KeepAwakeLidWatchdog

          xcrun swiftc "$HELPER_SRC" \
            -parse-as-library \
            -O \
            -target x86_64-apple-macos13.0 \
            -framework CoreGraphics -framework IOKit \
            -o build/x86_64/KeepAwakeLidWatchdog

          lipo -create \
            build/arm64/KeepAwakeMac \
            build/x86_64/KeepAwakeMac \
            -output "build/KeepAwakeMac.app/Contents/MacOS/KeepAwakeMac"

          lipo -create \
            build/arm64/KeepAwakeLidWatchdog \
            build/x86_64/KeepAwakeLidWatchdog \
            -output "build/KeepAwakeMac.app/Contents/MacOS/KeepAwakeLidWatchdog"
          chmod +x "build/KeepAwakeMac.app/Contents/MacOS/KeepAwakeLidWatchdog"

          cp KeepAwakeMac/Info.plist "build/KeepAwakeMac.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.lotfy.keepawakemac' "build/KeepAwakeMac.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable KeepAwakeMac' "build/KeepAwakeMac.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName KeepAwakeMac' "build/KeepAwakeMac.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDevelopmentRegion en' "build/KeepAwakeMac.app/Contents/Info.plist"

          codesign --force --deep --sign - "build/KeepAwakeMac.app"
          codesign --verify --deep --strict --verbose=2 "build/KeepAwakeMac.app"
          file "build/KeepAwakeMac.app/Contents/MacOS/KeepAwakeMac"
          file "build/KeepAwakeMac.app/Contents/MacOS/KeepAwakeLidWatchdog"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dmg
          cp -R "build/KeepAwakeMac.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create \
            -volname "KeepAwakeMac" \
            -srcfolder build/dmg \
            -ov \
            -format UDZO \
            "build/KeepAwakeMac.dmg"
          hdiutil verify "build/KeepAwakeMac.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwakeMac-DMG
          path: build/KeepAwakeMac.dmg
          if-no-files-found: error
          retention-days: 30
